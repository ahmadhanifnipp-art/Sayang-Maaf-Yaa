<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Weli Sayang ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd1e1);
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* =========================
           BUKET
        ========================== */

        .bouquet {
            position: relative;
            width: 360px;
            height: 430px;
            animation: bouquetAppear 2s ease forwards;
        }

        /* Kertas pembungkus */
        .wrapper {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 270px;
            height: 230px;
            background: linear-gradient(135deg, #fff8fb, #ffc9dc);
            clip-path: polygon(10% 0, 90% 0, 70% 100%, 30% 100%);
            box-shadow: 0 8px 25px rgba(170, 80, 110, 0.2);
            z-index: 5;
        }

        .wrapper::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 15px;
            background: rgba(255, 255, 255, 0.6);
            top: 35px;
            left: 0;
            transform: rotate(-8deg);
        }

        /* Batang */
        .stem {
            position: absolute;
            width: 6px;
            background: linear-gradient(to right, #397d45, #65a96d);
            bottom: 115px;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            z-index: 2;
        }

        /* Bunga kiri */
        .stem1 {
            height: 248px;
            transform: rotate(-25deg);
        }

        /* Bunga atas tengah */
        .stem2 {
            height: 255px;
            transform: rotate(0deg);
        }

        /* Bunga kanan */
        .stem3 {
            height: 246px;
            transform: rotate(26.6deg);
        }

        /* Bunga kiri bawah */
        .stem4 {
            height: 172px;
            transform: rotate(-16.9deg);
        }

        /* Bunga kanan bawah */
        .stem5 {
            height: 179px;
            transform: rotate(23deg);
        }

        /* Daun */
        .leaf {
            position: absolute;
            width: 45px;
            height: 20px;
            background: #4f9b5d;
            border-radius: 100% 0 100% 0;
            z-index: 3;
        }

        .leaf1 {
            bottom: 190px;
            left: 85px;
            transform: rotate(25deg);
        }

        .leaf2 {
            bottom: 160px;
            right: 80px;
            transform: rotate(155deg);
        }

        .leaf3 {
            bottom: 135px;
            left: 125px;
            transform: rotate(10deg);
        }

        /* =========================
           BUNGA
        ========================== */

        .flower {
            position: absolute;
            width: 110px;
            height: 110px;
            z-index: 6;
            transform: scale(0);
            animation: bloom 2s ease forwards;
        }

        .flower1 {
            top: 40px;
            left: 20px;
            animation-delay: 1s;
        }

        .flower2 {
            top: 10px;
            left: 125px;
            animation-delay: 1.5s;
        }

        .flower3 {
            top: 45px;
            right: 15px;
            animation-delay: 2s;
        }

        .flower4 {
            top: 100px;
            left: 75px;
            animation-delay: 2.5s;
        }

        .flower5 {
            top: 100px;
            right: 65px;
            animation-delay: 3s;
        }

        .petal {
            position: absolute;
            width: 52px;
            height: 70px;
            left: 29px;
            top: 20px;
            background: linear-gradient(135deg, #ff668e, #ffb3c7);
            border-radius: 50% 50% 45% 45%;
            transform-origin: bottom center;
            box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
        }

        .petal:nth-child(1) {
            transform: rotate(0deg);
        }

        .petal:nth-child(2) {
            transform: rotate(72deg);
        }

        .petal:nth-child(3) {
            transform: rotate(144deg);
        }

        .petal:nth-child(4) {
            transform: rotate(216deg);
        }

        .petal:nth-child(5) {
            transform: rotate(288deg);
        }

        /* TITIK KUNING DI TENGAH BUNGA */
        .center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff2a8, #ffbd3f);
            border-radius: 50%;
            top: 75px;
            left: 40px;
            z-index: 3;
            box-shadow: 0 0 10px rgba(255, 180, 50, 0.6);
        }

        /* =========================
           PESAN
        ========================== */

        .message {
            position: absolute;
            bottom: 35px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: messageAppear 2s ease forwards;
            animation-delay: 5s;
            z-index: 20;
        }

        .message h1 {
            font-size: 30px;
            color: #c92f62;
            margin-bottom: 12px;
            text-shadow: 0 2px 5px rgba(160, 40, 80, 0.15);
        }

        .message p {
            font-size: 21px;
            line-height: 1.6;
            color: #7d304b;
        }

        .heart {
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }

        /* =========================
           ANIMASI
        ========================== */

        @keyframes bouquetAppear {
            from {
                opacity: 0;
                transform: translateY(80px) scale(0.7);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes bloom {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.15) rotate(5deg);
                opacity: 1;
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes messageAppear {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.35);
            }
        }

        /* Kelopak kecil jatuh */
        .falling-petal {
            position: absolute;
            top: -30px;
            width: 15px;
            height: 20px;
            background: #ff8fb0;
            border-radius: 50% 0 50% 0;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translateY(-30px) rotate(0deg);
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
            }
        }

        /* Responsif HP */
        @media (max-width: 600px) {

            .bouquet {
                transform: scale(0.8);
                margin-top: -40px;
            }

            .message {
                bottom: 45px;
            }

            .message h1 {
                font-size: 24px;
            }

            .message p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Kelopak bunga jatuh -->
        <div class="falling-petal" style="left:10%; animation-duration:7s;"></div>
        <div class="falling-petal" style="left:25%; animation-duration:9s; animation-delay:2s;"></div>
        <div class="falling-petal" style="left:45%; animation-duration:8s; animation-delay:1s;"></div>
        <div class="falling-petal" style="left:65%; animation-duration:10s; animation-delay:3s;"></div>
        <div class="falling-petal" style="left:85%; animation-duration:7s; animation-delay:4s;"></div>

        <!-- BUKET -->
        <div class="bouquet">

            <!-- Batang -->
            <div class="stem stem1"></div>
            <div class="stem stem2"></div>
            <div class="stem stem3"></div>
            <div class="stem stem4"></div>
            <div class="stem stem5"></div>

            <!-- Daun -->
            <div class="leaf leaf1"></div>
            <div class="leaf leaf2"></div>
            <div class="leaf leaf3"></div>

            <!-- Bunga 1 -->
            <div class="flower flower1">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- Bunga 2 -->
            <div class="flower flower2">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- Bunga 3 -->
            <div class="flower flower3">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- Bunga 4 -->
            <div class="flower flower4">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- Bunga 5 -->
            <div class="flower flower5">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>

            <!-- Pembungkus buket -->
            <div class="wrapper"></div>

        </div>

        <!-- PESAN -->
        <div class="message">

            <h1>Weli Sayang ❤️</h1>

            <p>
                Aku minta maaf yaa 🥺<br>
                Jangan terlalu lama marahnya ya sayangg...
                <br>
                <strong>I love you <span class="heart">❤️</span></strong>
            </p>

        </div>

    </div>

</body>
</html>
